name: Bonjour
on:
  - push
  - pull_request:
    types: [opened, edited]
jobs:
  dire_bonjour:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5   
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: ls -l
